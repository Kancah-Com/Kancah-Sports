
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semua Berita | Kancah Sports</title>
<meta name="description" content="Semua berita olahraga terbaru Kancah Sports.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090909;--card:#151515;--line:rgba(255,255,255,.13);--muted:#8b8b8b;--orange:#ff4d00;--white:#f5f5f5;--max:1220px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}.container{width:min(calc(100% - 40px),var(--max));margin:auto}
a{color:inherit;text-decoration:none}.header{position:sticky;top:0;z-index:20;background:rgba(9,9,9,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.header-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:30px}.logo{height:38px;width:auto;display:block}.nav{display:flex;align-items:center;gap:28px}.nav a{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#8d8d8d;padding:28px 0;position:relative}.nav a:hover,.nav a.active{color:#fff}.nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--orange)}.back{border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.back:hover{background:var(--orange);color:#050505;border-color:var(--orange)}main{padding:54px 0 90px}.eyebrow{display:block;color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}.title{font-size:clamp(42px,6vw,82px);line-height:.9;letter-spacing:-.065em;text-transform:uppercase;margin:0 0 18px}.intro{max-width:650px;color:var(--muted);line-height:1.6;margin:0 0 34px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tab{border:1px solid var(--line);background:#101010;color:#ddd;border-radius:999px;padding:10px 13px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.tab.active,.tab:hover{background:var(--orange);color:#050505;border-color:var(--orange)}.count{color:#777;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-4px);border-color:rgba(255,77,0,.65);box-shadow:0 18px 50px rgba(0,0,0,.28)}.image{display:block;aspect-ratio:16/10;background:#111;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s}.card:hover img{transform:scale(1.05)}.body{padding:18px}.cat{display:inline-block;background:var(--orange);color:#050505;padding:7px 9px;border-radius:5px;font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}.card h2{font-size:21px;line-height:1.05;letter-spacing:-.035em;text-transform:uppercase;margin:0}.card p{color:var(--muted);font-size:13px;line-height:1.5;margin:10px 0 0}.meta{display:flex;justify-content:space-between;gap:10px;color:#777;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:16px}.empty{text-align:center;padding:60px;color:#777;border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}.footer{border-top:1px solid var(--line);padding:28px 0;color:#666;font-size:10px;letter-spacing:.1em;text-transform:uppercase}@media(max-width:900px){.nav{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.container{width:min(calc(100% - 24px),var(--max))}.header-inner{min-height:68px}.logo{height:32px}.back{font-size:9px}.title{font-size:48px}.grid{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="header"><div class="container header-inner"><a href="index.html#top"><img class="logo" src="logo-kancah.png" alt="Kancah Sports"></a><nav class="nav"><a href="index.html#top-stories">Berita</a><a href="index.html#latest-news" class="active">Terkini</a><a href="index.html#timnas">Timnas</a><a href="index.html#transfer">Transfer</a><a href="index.html#fixtures">Jadwal</a><a href="index.html#standings">Klasemen</a></nav><a class="back" href="index.html">← Kembali ke Home</a></div></header>
<main><div class="container"><span class="eyebrow">Kancah Sports</span><h1 class="title">Semua Berita</h1><p class="intro">Seluruh berita olahraga yang dipublikasikan Kancah Sports, dari Timnas, liga, transfer, hingga analisis dan taktik.</p><div class="toolbar"><div class="tabs" id="tabs"><button class="tab active" data-filter="all">Semua</button></div><div class="count" id="count">Memuat berita…</div></div><div class="grid" id="grid"><div class="empty">Memuat berita terbaru…</div></div></div></main><footer class="footer"><div class="container">© Kancah Sports — Portal Berita Olahraga</div></footer>
<script>
const SUPABASE_URL="https://tnaehvirowknfsjdsrer.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_1bbk42A04hdCCh1CBFTK1A_zES8rBia";const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const FALLBACK_IMG="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=1200&auto=format&fit=crop";
const safe=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const href=a=>`article.html?slug=${encodeURIComponent(a.slug||'')}`;const img=a=>a.image_url||FALLBACK_IMG;const slug=s=>(s||'umum').toLowerCase().trim().replace(/\s+/g,'-');
function ago(d){if(!d)return'';const m=Math.floor((Date.now()-new Date(d).getTime())/60000);if(m<1)return'Baru saja';if(m<60)return`${m} menit lalu`;const h=Math.floor(m/60);if(h<24)return`${h} jam lalu`;const day=Math.floor(h/24);if(day<7)return`${day} hari lalu`;return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
let all=[];
function card(a){return `<article class="card" data-cat="${safe(slug(a.category))}"><a class="image" href="${href(a)}"><img src="${safe(img(a))}" alt="${safe(a.title||'Berita')}" loading="lazy"></a><div class="body"><div class="cat">${safe(a.category||'Berita')}</div><h2><a href="${href(a)}">${safe(a.title||'Berita Kancah Sports')}</a></h2><p>${safe(a.excerpt||'')}</p><div class="meta"><span>${ago(a.published_at||a.created_at)}</span><span>${safe(a.source_name||'Kancah Sports')}</span></div></div></article>`}
function render(filter='all'){const grid=document.getElementById('grid');const rows=filter==='all'?all:all.filter(a=>slug(a.category)===filter);grid.innerHTML=rows.map(card).join('')||'<div class="empty">Tidak ada berita untuk kategori ini.</div>';document.getElementById('count').textContent=`${rows.length} berita`}
async function load(){const {data,error}=await db.from('articles').select('*').eq('status','published').order('published_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}).limit(200);if(error){console.error(error);document.getElementById('grid').innerHTML='<div class="empty">Gagal memuat berita. Silakan muat ulang.</div>';return}all=data||[];const cats=[...new Set(all.map(a=>(a.category||'').trim()).filter(Boolean))].sort();document.getElementById('tabs').innerHTML='<button class="tab active" data-filter="all">Semua</button>'+cats.map(c=>`<button class="tab" data-filter="${safe(slug(c))}">${safe(c)}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));render()}
load();
</script>
</body></html>
