<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Kancah Sports — Artikel</title>
  <meta name="description" content="Kancah Sports — berita olahraga terbaru dan terupdate.">
  <meta name="robots" content="index,follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --orange:#ff4d00;
      --orange-dark:#d83f00;
      --black:#080808;
      --black-2:#0d0d0d;
      --card:#151515;
      --card2:#1d1d1d;
      --line:rgba(255,255,255,.10);
      --line-strong:rgba(255,255,255,.18);
      --white:#fff;
      --muted:#9b9b9b;
      --soft:#dedede;
      --green:#24d98b;
      --container:1280px;
      --radius:14px;
      --shadow:0 20px 60px rgba(0,0,0,.30);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:
        radial-gradient(circle at 5% 0,rgba(255,77,0,.10),transparent 28vw),
        var(--black);
      color:var(--white);
      font-family:Ubuntu,Arial,sans-serif;
      line-height:1.7;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    body.menu-open{
      overflow:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      display:block;
      max-width:100%;
    }

    button,
    input{
      font:inherit;
    }

    ::selection{
      background:var(--orange);
      color:#000;
    }

    .container{
      width:min(var(--container),calc(100% - 32px));
      margin:auto;
    }


    /* =========================================================
       READING PROGRESS
    ========================================================= */

    .reading-progress{
      position:fixed;
      top:0;
      left:0;
      z-index:9999;
      width:0%;
      height:3px;
      background:var(--orange);
      box-shadow:0 0 12px rgba(255,77,0,.45);
    }


    /* =========================================================
       HEADER — SAMA DENGAN HOMEPAGE
    ========================================================= */

    header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(8,8,8,.94);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .head{
      height:76px;
      display:flex;
      align-items:center;
      gap:28px;
    }

    .brand{
      display:flex;
      align-items:center;
      font-weight:700;
      font-size:20px;
      white-space:nowrap;
    }

    .brand-logo{
      width:180px;
      height:34px;
      position:relative;
      overflow:hidden;
      display:block;
      flex:0 0 180px;
    }

    .brand-logo img{
      position:absolute;
      width:215px;
      height:auto;
      max-width:none;
      left:-18px;
      top:-121px;
    }

    .nav{
      display:flex;
      gap:22px;
      align-items:center;
      font-size:13px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .nav a:hover,
    .nav a.active{
      color:var(--orange);
    }

    .head-right{
      margin-left:auto;
      display:flex;
      gap:9px;
      align-items:center;
    }

    .icon{
      width:40px;
      height:40px;
      border:1px solid var(--line);
      background:#111;
      color:#fff;
      border-radius:50%;
      cursor:pointer;
      display:grid;
      place-items:center;
    }

    .icon:hover{
      border-color:var(--orange);
      color:var(--orange);
    }

    .subscribe{
      border:0;
      background:var(--orange);
      color:#000;
      padding:12px 18px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
    }

    .subscribe:hover{
      background:#fff;
    }


    /* =========================================================
       BREAKING BAR
    ========================================================= */

    .breaking{
      border-bottom:1px solid var(--line);
      background:#101010;
    }

    .breaking-in{
      display:flex;
      min-height:40px;
      align-items:center;
      gap:12px;
      font-size:12px;
    }

    .breaking-label{
      background:var(--orange);
      color:#000;
      font-weight:700;
      padding:6px 10px;
      text-transform:uppercase;
      font-size:10px;
      flex:none;
    }

    .breaking-title{
      font-weight:500;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .breaking-time{
      margin-left:auto;
      color:var(--muted);
      font-size:10px;
      white-space:nowrap;
    }


    /* =========================================================
       ARTICLE WRAPPER
    ========================================================= */

    main{
      padding:34px 0 80px;
    }

    .article-layout{
      display:grid;
      grid-template-columns:minmax(0,850px) 300px;
      gap:34px;
      align-items:start;
      max-width:1180px;
      margin:auto;
    }

    .article-main{
      min-width:0;
    }


    /* =========================================================
       BREADCRUMB
    ========================================================= */

    .breadcrumb{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:7px;
      color:#707070;
      font-size:9px;
      font-weight:800;
      letter-spacing:.10em;
      text-transform:uppercase;
      margin-bottom:25px;
    }

    .breadcrumb a:hover{
      color:var(--orange);
    }

    .breadcrumb .current{
      color:#aaa;
      max-width:350px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }


    /* =========================================================
       ARTICLE HEADER
    ========================================================= */

    .article-category{
      display:inline-flex;
      align-items:center;
      background:var(--orange);
      color:#000;
      padding:7px 10px;
      border-radius:5px;
      font-size:9px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      margin-bottom:15px;
    }

    .article-title{
      font-size:clamp(38px,5vw,70px);
      line-height:.94;
      letter-spacing:-.065em;
      text-transform:uppercase;
      max-width:1000px;
    }

    .article-deck{
      margin-top:18px;
      max-width:790px;
      color:#c9c9c9;
      font-size:18px;
      line-height:1.55;
    }

    .article-meta{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:9px;
      margin-top:18px;
      color:#777;
      font-size:10px;
      font-weight:800;
      letter-spacing:.07em;
      text-transform:uppercase;
    }

    .article-meta strong{
      color:#fff;
    }

    .meta-dot{
      color:var(--orange);
    }


    /* =========================================================
       HERO IMAGE
    ========================================================= */

    .hero-wrap{
      margin-top:28px;
    }

    .hero-image{
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      background:#111;
      border:1px solid var(--line);
      border-radius:12px;
    }

    .image-caption{
      margin-top:8px;
      color:#666;
      font-size:9px;
      line-height:1.4;
    }


    /* =========================================================
       ARTICLE BODY AREA
    ========================================================= */

    .article-body-layout{
      display:grid;
      grid-template-columns:44px minmax(0,1fr);
      gap:20px;
      margin-top:30px;
    }


    /* =========================================================
       SHARE RAIL
    ========================================================= */

    .share-rail{
      display:flex;
      flex-direction:column;
      gap:8px;
      position:sticky;
      top:105px;
      align-self:start;
    }

    .share-label{
      color:#666;
      font-size:8px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
      writing-mode:vertical-rl;
      transform:rotate(180deg);
      margin:auto;
    }

    .share-btn{
      width:38px;
      height:38px;
      border:1px solid var(--line);
      border-radius:8px;
      background:#111;
      color:#bbb;
      display:grid;
      place-items:center;
      cursor:pointer;
      font-size:12px;
      font-weight:900;
    }

    .share-btn:hover{
      background:var(--orange);
      color:#000;
      border-color:var(--orange);
    }


    /* =========================================================
       ARTICLE CONTENT
    ========================================================= */

    .content{
      color:#dedede;
      font-size:17px;
      line-height:1.9;
    }

    .content p{
      margin:0 0 22px;
    }

    .content p:first-child:first-letter{
      float:left;
      font-size:64px;
      line-height:.82;
      padding:7px 10px 0 0;
      color:var(--orange);
      font-weight:900;
    }

    .content h2{
      color:#fff;
      font-size:25px;
      line-height:1.1;
      letter-spacing:-.03em;
      text-transform:uppercase;
      margin:35px 0 15px;
    }

    .content h3{
      color:#fff;
      font-size:20px;
      line-height:1.2;
      margin:28px 0 12px;
    }

    .content blockquote{
      border-left:4px solid var(--orange);
      margin:30px 0;
      padding:15px 20px;
      background:#111;
      color:#eee;
      font-size:19px;
      font-weight:700;
    }

    .content ul,
    .content ol{
      padding-left:25px;
      margin:0 0 22px;
    }

    .content li{
      margin-bottom:8px;
    }


    /* =========================================================
       TAGS
    ========================================================= */

    .article-tags{
      margin-top:35px;
      padding-top:20px;
      border-top:1px solid var(--line);
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    .article-tags-label{
      color:#666;
      font-size:9px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.12em;
      margin-right:3px;
    }

    .article-tag{
      border:1px solid var(--line);
      background:#101010;
      color:#aaa;
      border-radius:999px;
      padding:7px 10px;
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
    }

    .article-tag:hover{
      background:var(--orange);
      border-color:var(--orange);
      color:#000;
    }


    /* =========================================================
       AUTHOR BOX
    ========================================================= */

    .author-box{
      margin-top:30px;
      padding:18px;
      border:1px solid var(--line);
      background:var(--card);
      border-radius:12px;
      display:flex;
      align-items:center;
      gap:15px;
    }

    .author-avatar{
      width:54px;
      height:54px;
      flex:none;
      border-radius:50%;
      background:var(--orange);
      color:#000;
      display:grid;
      place-items:center;
      font-size:18px;
      font-weight:900;
    }

    .author-label{
      color:#666;
      font-size:8px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .author-name{
      margin-top:2px;
      font-size:14px;
      font-weight:900;
      text-transform:uppercase;
    }

    .author-desc{
      margin-top:2px;
      color:#777;
      font-size:10px;
    }


    /* =========================================================
       PREVIOUS / NEXT
    ========================================================= */

    .article-navigation{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      margin-top:32px;
      border-top:1px solid var(--line);
      padding-top:25px;
    }

    .nav-story{
      min-width:0;
    }

    .nav-story.next{
      text-align:right;
    }

    .nav-label{
      color:#666;
      font-size:8px;
      font-weight:900;
      letter-spacing:.15em;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .nav-card{
      display:grid;
      grid-template-columns:105px minmax(0,1fr);
      gap:12px;
      align-items:center;
      padding:10px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      transition:.2s ease;
      text-align:left;
    }

    .nav-story.next .nav-card{
      grid-template-columns:minmax(0,1fr) 105px;
      text-align:right;
    }

    .nav-card:hover{
      border-color:rgba(255,77,0,.55);
      transform:translateY(-2px);
    }

    .nav-image{
      width:105px;
      height:75px;
      border-radius:7px;
      object-fit:cover;
      background:#111;
    }

    .nav-category{
      color:var(--orange);
      font-size:8px;
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
    }

    .nav-title{
      margin-top:5px;
      font-size:12px;
      font-weight:900;
      line-height:1.2;
      text-transform:uppercase;
    }

    .nav-empty{
      min-height:95px;
      display:flex;
      align-items:center;
      color:#444;
      border:1px dashed var(--line);
      border-radius:10px;
      padding:15px;
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
    }


    /* =========================================================
       RELATED ARTICLES
    ========================================================= */

    .related{
      margin-top:45px;
      padding-top:25px;
      border-top:1px solid var(--line);
    }

    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:20px;
      margin-bottom:18px;
    }

    .eyebrow{
      color:var(--orange);
      font-size:10px;
      font-weight:900;
      letter-spacing:.17em;
      text-transform:uppercase;
    }

    .section-title{
      margin-top:4px;
      font-size:25px;
      line-height:1;
      letter-spacing:-.04em;
      text-transform:uppercase;
    }

    .related-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
    }

    .related-card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      transition:.2s ease;
    }

    .related-card:hover{
      transform:translateY(-2px);
      border-color:rgba(255,77,0,.55);
    }

    .related-image{
      height:180px;
      overflow:hidden;
      background:#111;
    }

    .related-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:.3s ease;
    }

    .related-card:hover img{
      transform:scale(1.04);
    }

    .related-body{
      padding:13px;
    }

    .related-category{
      color:var(--orange);
      font-size:8px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.12em;
    }

    .related-title{
      margin-top:7px;
      font-size:16px;
      line-height:1.12;
      text-transform:uppercase;
    }

    .related-meta{
      margin-top:9px;
      color:#666;
      font-size:8px;
      font-weight:800;
      text-transform:uppercase;
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar{
      display:grid;
      gap:16px;
      position:sticky;
      top:100px;
    }

    .sidebar-box{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
    }

    .sidebar-title{
      padding:14px 15px;
      border-bottom:1px solid var(--line);
      font-size:12px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.10em;
    }

    .latest-list{
      padding:8px 14px;
    }

    .latest-item{
      display:grid;
      grid-template-columns:76px 1fr;
      gap:10px;
      padding:11px 0;
      border-bottom:1px solid var(--line);
    }

    .latest-item:last-child{
      border-bottom:0;
    }

    .latest-image{
      width:76px;
      height:60px;
      object-fit:cover;
      border-radius:7px;
      background:#111;
    }

    .latest-category{
      color:var(--orange);
      font-size:7px;
      font-weight:900;
      letter-spacing:.10em;
      text-transform:uppercase;
    }

    .latest-title{
      margin-top:4px;
      font-size:10px;
      line-height:1.2;
      font-weight:800;
      text-transform:uppercase;
    }

    .latest-time{
      margin-top:5px;
      color:#666;
      font-size:7px;
      font-weight:800;
      text-transform:uppercase;
    }


    /* =========================================================
       SIDEBAR SEARCH
    ========================================================= */

    .sidebar-search{
      padding:12px;
    }

    .sidebar-search input{
      width:100%;
      border:1px solid var(--line);
      background:#0b0b0b;
      color:#fff;
      border-radius:7px;
      padding:11px;
      outline:none;
      font-size:11px;
    }

    .sidebar-search input:focus{
      border-color:var(--orange);
    }


    /* =========================================================
       ADS
    ========================================================= */

    .ad{
      min-height:250px;
      border:1px dashed rgba(255,255,255,.13);
      background:#0d0d0d;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#555;
      font-size:8px;
      text-transform:uppercase;
      letter-spacing:.14em;
      overflow:hidden;
    }

    .ad ins{
      display:block;
      width:100%;
      min-height:250px;
    }


    /* =========================================================
       CATEGORY LIST
    ========================================================= */

    .category-list{
      padding:8px 14px;
    }

    .category-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:9px 0;
      border-bottom:1px dotted #333;
      color:#888;
      font-size:9px;
      text-transform:uppercase;
    }

    .category-row:last-child{
      border-bottom:0;
    }

    .category-row:hover{
      color:var(--orange);
    }

    .category-count{
      width:18px;
      height:18px;
      display:grid;
      place-items:center;
      border-radius:4px;
      background:#222;
      color:#777;
      font-size:7px;
    }


    /* =========================================================
       TRENDING
    ========================================================= */

    .trend-list{
      padding:13px;
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .trend-tag{
      border:1px solid var(--line);
      background:#0c0c0c;
      color:#aaa;
      padding:7px 9px;
      border-radius:999px;
      font-size:8px;
      font-weight:800;
      text-transform:uppercase;
    }

    .trend-tag:hover{
      background:var(--orange);
      color:#000;
      border-color:var(--orange);
    }


    /* =========================================================
       NEWSLETTER
    ========================================================= */

    .newsletter{
      margin-top:55px;
      border:1px solid rgba(255,77,0,.35);
      border-radius:16px;
      background:linear-gradient(
        135deg,
        rgba(255,77,0,.95),
        rgba(255,77,0,.55)
      );
      color:#000;
      padding:35px;
    }

    .newsletter-inner{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:25px;
    }

    .newsletter h2{
      font-size:34px;
      line-height:.95;
      letter-spacing:-.06em;
      text-transform:uppercase;
    }

    .newsletter p{
      margin-top:9px;
      font-size:11px;
      font-weight:700;
      max-width:650px;
    }


    /* =========================================================
       FOOTER — SAMA DENGAN HOMEPAGE
    ========================================================= */

    footer{
      border-top:1px solid var(--line);
      padding:40px 0;
      color:#777;
      font-size:11px;
      background:#080808;
    }

    .footer-in{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:center;
    }

    .footer-brand-logo{
      width:180px;
      height:30px;
      position:relative;
      overflow:hidden;
      display:block;
      margin-bottom:8px;
    }

    .footer-brand-logo img{
      position:absolute;
      width:215px;
      height:auto;
      max-width:none;
      left:-18px;
      top:-121px;
    }


    /* =========================================================
       SEARCH MODAL
    ========================================================= */

    .search{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.78);
      backdrop-filter:blur(10px);
      z-index:500;
      display:none;
      align-items:flex-start;
      justify-content:center;
      padding:100px 16px;
    }

    .search.open{
      display:flex;
    }

    .search-box{
      width:min(700px,100%);
      background:#151515;
      border:1px solid var(--line-strong);
      border-radius:14px;
      padding:20px;
      box-shadow:var(--shadow);
    }

    .search-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
    }

    .search-head strong{
      font-size:14px;
      text-transform:uppercase;
    }

    .search-box input{
      width:100%;
      background:#090909;
      color:#fff;
      border:1px solid var(--line);
      padding:15px;
      border-radius:8px;
      outline:none;
    }

    .search-box input:focus{
      border-color:var(--orange);
    }

    .results{
      margin-top:12px;
      max-height:55vh;
      overflow:auto;
    }

    .result{
      display:block;
      padding:12px;
      border-top:1px solid var(--line);
    }

    .result:hover{
      background:#111;
    }

    .result small{
      color:var(--orange);
      text-transform:uppercase;
      font-size:8px;
      font-weight:900;
    }

    .result strong{
      display:block;
      margin-top:3px;
      font-size:12px;
    }


    /* =========================================================
       BACK TO TOP
    ========================================================= */

    .to-top{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:80;
      width:42px;
      height:42px;
      border:0;
      border-radius:50%;
      background:var(--orange);
      color:#000;
      cursor:pointer;
      font-weight:900;
      opacity:0;

<script>

const SUPABASE_URL =
  "https://tnaehvirowknfsjdsrer.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_1bbk42A04hdCCh1CBFTK1A_zES8rBia";

  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   GLOBAL
========================================================= */

let ARTICLES = [];
let CURRENT_ARTICLE = null;

const fallbackImage =
  "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=1200&auto=format&fit=crop";


/* =========================================================
   SECURITY
========================================================= */

function esc(value = ""){

  return String(value)
    .replace(/[&<>"']/g, function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[char];

    });

}


/* =========================================================
   IMAGE
========================================================= */

function articleImage(article){

  return article &&
    article.image_url &&
    String(article.image_url).trim()

      ? article.image_url

      : fallbackImage;

}


/* =========================================================
   URL
========================================================= */

function articleHref(article){

  return "article.html?slug=" +
    encodeURIComponent(article.slug || "");

}


/* =========================================================
   DATE
========================================================= */

function articleDate(article){

  return article.published_at ||
         article.created_at ||
         null;

}


function formatDate(value){

  if(!value) return "Terbaru";

  return new Date(value).toLocaleDateString(
    "id-ID",
    {
      day:"2-digit",
      month:"long",
      year:"numeric"
    }
  );

}


function formatDateTime(value){

  if(!value) return "—";

  return new Date(value).toLocaleString(
    "id-ID",
    {
      day:"2-digit",
      month:"long",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function timeAgo(value){

  if(!value) return "—";

  const date =
    new Date(value);

  const seconds =
    Math.max(
      0,
      (Date.now() - date.getTime()) / 1000
    );

  if(seconds < 60)
    return "Baru saja";

  if(seconds < 3600)
    return Math.floor(seconds / 60) + " menit lalu";

  if(seconds < 86400)
    return Math.floor(seconds / 3600) + " jam lalu";

  if(seconds < 172800)
    return "Kemarin";

  return Math.floor(seconds / 86400) + " hari lalu";

}


/* =========================================================
   READING TIME
========================================================= */

function readingTime(text = ""){

  const words =
    String(text)
      .trim()
      .split(/\s+/)
      .filter(Boolean)
      .length;

  if(!words)
    return 1;

  return Math.max(
    1,
    Math.ceil(words / 200)
  );

}


/* =========================================================
   CONTENT PARSER
========================================================= */

function contentToHtml(content = ""){

  const text =
    String(content).trim();

  if(!text)
    return `
      <p>
        Artikel ini belum memiliki isi.
      </p>
    `;

  /*
    Mendukung:
    - paragraf kosong
    - heading sederhana
    - blockquote dengan tanda "
  */

  const blocks =
    text
      .split(/\n\s*\n/)
      .map(block => block.trim())
      .filter(Boolean);

  return blocks.map(block => {

    const safe =
      esc(block);

    if(
      /^#{2}\s+/.test(block)
    ){

      return `
        <h2>
          ${safe.replace(/^##\s+/,"")}
        </h2>
      `;

    }

    if(
      /^#{3}\s+/.test(block)
    ){

      return `
        <h3>
          ${safe.replace(/^###\s+/,"")}
        </h3>
      `;

    }

    if(
      /^>\s+/.test(block)
    ){

      return `
        <blockquote>
          ${safe.replace(/^>\s+/,"")}
        </blockquote>
      `;

    }

    if(
      /^\-\s+/.test(block)
    ){

      const items =
        block
          .split(/\n/)
          .map(item =>
            item.replace(/^\-\s+/,"")
          )
          .map(item =>
            `<li>${esc(item)}</li>`
          )
          .join("");

      return `
        <ul>${items}</ul>
      `;

    }

    return `
      <p>
        ${safe.replace(/\n/g,"<br>")}
      </p>
    `;

  }).join("");

}


/* =========================================================
   META / SEO
========================================================= */

function updateMeta(article){

  const title =
    article.seo_title ||
    article.title ||
    "Kancah Sports";

  const description =
    article.seo_description ||
    article.excerpt ||
    "Berita terbaru Kancah Sports.";

  document.title =
    `${title} | Kancah Sports`;

  const descriptionMeta =
    document.querySelector(
      'meta[name="description"]'
    );

  if(descriptionMeta){

    descriptionMeta.setAttribute(
      "content",
      description
    );

  }

  let canonical =
    document.querySelector(
      'link[rel="canonical"]'
    );

  if(!canonical){

    canonical =
      document.createElement("link");

    canonical.rel =
      "canonical";

    document.head.appendChild(
      canonical
    );

  }

  canonical.href =
    window.location.href;


  /* OPEN GRAPH */

  setMetaProperty(
    "og:title",
    title
  );

  setMetaProperty(
    "og:description",
    description
  );

  setMetaProperty(
    "og:type",
    "article"
  );

  setMetaProperty(
    "og:image",
    articleImage(article)
  );

}


function setMetaProperty(
  property,
  content
){

  let meta =
    document.querySelector(
      `meta[property="${property}"]`
    );

  if(!meta){

    meta =
      document.createElement("meta");

    meta.setAttribute(
      "property",
      property
    );

    document.head.appendChild(
      meta
    );

  }

  meta.setAttribute(
    "content",
    content || ""
  );

}


/* =========================================================
   BREAKING
========================================================= */

function renderBreaking(){

  if(!ARTICLES.length)
    return;

  const latest =
    [...ARTICLES]
      .sort(
        (a,b) =>

/* =========================================================
   PREVIOUS / NEXT
========================================================= */

function renderArticleNavigation(){

  const prevWrap =
    document.getElementById(
      "previousArticle"
    );

  const nextWrap =
    document.getElementById(
      "nextArticle"
    );

  if(!CURRENT_ARTICLE)
    return;

  const currentIndex =
    ARTICLES.findIndex(
      article =>
        article.slug ===
        CURRENT_ARTICLE.slug
    );

  /*
    ARTICLES sudah disortir:
    terbaru → terlama

    Jadi:
    index + 1 = artikel sebelumnya
    index - 1 = artikel berikutnya
  */

  const newer =
    currentIndex > 0
      ? ARTICLES[currentIndex - 1]
      : null;

  const older =
    currentIndex >= 0 &&
    currentIndex < ARTICLES.length - 1
      ? ARTICLES[currentIndex + 1]
      : null;


  if(newer){

    nextWrap.innerHTML = `

      <div class="nav-label">
        Artikel Berikutnya

      <a
        href="${articleHref(newer)}"
        class="nav-card">

        <div>

          <div class="nav-category">
            ${esc(newer.category || "Berita")}

          <div class="nav-title">
            ${esc(newer.title || "Tanpa judul")}

        </div>

        <img
          class="nav-image"

        Artikel Berikutnya

      <div class="nav-empty">
        Belum ada artikel berikutnya.
      </div>

  }


  if(older){

    prevWrap.innerHTML = `

/* =========================================================

function renderRelated(){

      article =>
        article.slug !==
        CURRENT_ARTICLE.slug &&
        String(
          article.category || ""
        ).toLowerCase() === category
    );

  if(related.length < 2){

    const existingSlugs =
      new Set(
        related.map(
          article => article.slug

    const fallback =
      ARTICLES.filter(
        article =>
          article.slug !==
            CURRENT_ARTICLE.slug &&
          !existingSlugs.has(
            article.slug

    related = [
      ...related,

/* =========================================================
   LOAD ARTICLE
========================================================= */

async function loadArticle(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const slug =
    params.get("slug");

  const root =
    document.getElementById(
      "articleRoot"
    );

  if(!slug){

    root.className =
      "container error";

    root.innerHTML =
      "Slug artikel tidak ditemukan.";

    return;

  }


  /*
    Ambil SEMUA artikel published
    supaya Previous / Next dan
    Related bisa bekerja.
  */

  const {
    data,
    error
  } = await db
    .from("articles")
    .select("*")
    .eq("status","published")
    .order(
      "published_at",
      {
        ascending:false
      }
    )
    .limit(100);


  if(error){

    console.error(error);

    root.className =
      "container error";

    root.innerHTML =
      "Gagal memuat artikel.";

    return;

  }


  ARTICLES =
    data || [];


  const article =
    ARTICLES.find(
      item =>
        item.slug === slug
    );


  if(!article){

    root.className =
      "container error";

    root.innerHTML =
      "Artikel tidak ditemukan.";

    return;

  }


  renderBreaking();

  renderArticle(article);

}


/* =========================================================
   SOCIAL SHARE
========================================================= */

function currentArticleUrl(){

  return window.location.href;

}


function shareToFacebook(){

  const url =
    encodeURIComponent(
      currentArticleUrl()
    );

  window.open(
    "https://www.facebook.com/sharer/sharer.php?u=" + url,
    "_blank",
    "width=700,height=500"
  );

}


function shareToX(){

  const text =
    encodeURIComponent(
      CURRENT_ARTICLE
        ? CURRENT_ARTICLE.title
        : document.title
    );

  const url =
    encodeURIComponent(
      currentArticleUrl()
    );

  window.open(
    "https://twitter.com/intent/tweet?text=" +
    text +
    "&url=" +
    url,
    "_blank",
    "width=700,height=500"
  );

}


function shareToWhatsApp(){

  const text =
    encodeURIComponent(
      (
        CURRENT_ARTICLE
          ? CURRENT_ARTICLE.title
          : document.title
      ) +
      "\n\n" +
      currentArticleUrl()
    );

  window.open(
    "https://wa.me/?text=" + text,
    "_blank"
  );

}


async function copyArticleLink(){

  try{

    await navigator.clipboard.writeText(
      currentArticleUrl()
    );

    alert(
      "Link artikel berhasil disalin."
    );

  }catch(error){

    prompt(
      "Salin link artikel:",
      currentArticleUrl()
    );

  }

}


/* =========================================================
   SEARCH
========================================================= */

function buildSearch(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const output =
    document.getElementById(
      "searchResults"
    );

  if(!input || !output)
    return;

  const query =
    input.value
      .trim()
      .toLowerCase();

  const rows =
    ARTICLES
      .filter(article => {

        if(!query)
          return true;

        return (
          String(
            article.title || ""
          )
          .toLowerCase()
          .includes(query)
          ||
          String(
            article.category || ""
          )
          .toLowerCase()
          .includes(query)
        );

      })
      .slice(0,15);


  output.innerHTML =
    rows.map(article => `

      <a
        class="result"
        href="${articleHref(article)}">

        <small>
          ${esc(
            article.category ||
            "Berita"
          )}
        </small>

        <strong>
          ${esc(
            article.title ||
            "Tanpa judul"
          )}
        </strong>

      </a>

    `).join("")

    ||

    `
      <div class="result">

        <small>
          Tidak ditemukan
        </small>

        <strong>
          Coba kata kunci lain.
        </strong>

      </div>
    `;

}


/* =========================================================
   SIDEBAR SEARCH
========================================================= */

function sidebarSearch(){

  const input =
    document.getElementById(
      "sidebarSearch"
    );

  if(!input)
    return;

  input.addEventListener(
    "keydown",
    function(event){

      if(event.key !== "Enter")
        return;

      const query =
        input.value
          .trim()
          .toLowerCase();

      if(!query)
        return;

      const result =
        ARTICLES.find(
          article =>
            String(
              article.title || ""
            )
            .toLowerCase()
            .includes(query)
        );

      if(result){

        window.location.href =
          articleHref(result);

      }

    }
  );

}


/* =========================================================
   SEARCH MODAL EVENTS
========================================================= */

document
  .getElementById("searchBtn")

    document
      .getElementById("searchModal")
      .classList.add("open");

    document
      .getElementById("searchInput")
      .focus();

    buildSearch();

  };


document
  .getElementById("closeSearch")
  .onclick = function(){

    document
      .getElementById("searchModal")
      .classList.remove("open");

  };


document
  .getElementById("searchModal")
  .onclick = function(event){

    if(
      event.target.id ===
      "searchModal"
    ){

      event.currentTarget
        .classList
        .remove("open");

    }

  };


document
  .getElementById("searchInput")
  .oninput =
    buildSearch;


/* =========================================================
   ESC CLOSE SEARCH
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      document
        .getElementById("searchModal")
        .classList
        .remove("open");

    }

  }
);


/* =========================================================
   READING PROGRESS
========================================================= */

window.addEventListener(
  "scroll",
  function(){

    const progress =
      document.getElementById(
        "readingProgress"
      );

    const article =
      document.querySelector(
        ".article-main"
      );

    if(!progress || !article)
      return;

    const start =
      article.offsetTop;

    const total =
      article.offsetHeight -
      window.innerHeight;

    if(total <= 0)
      return;

    const current =
      window.scrollY -
      start;

    const percentage =
      Math.min(
        100,
        Math.max(
          0,
          (current / total) * 100
        )
      );

    progress.style.width =
      percentage + "%";

  }
);


/* =========================================================
   BACK TO TOP
========================================================= */

const toTop =
  document.getElementById(
    "toTop"
  );


window.addEventListener(
  "scroll",
  function(){

    if(
      window.scrollY > 500
    ){

      toTop.classList.add(
        "show"
      );

    }else{

      toTop.classList.remove(
        "show"
      );

    }

  }
);


toTop.onclick =
  function(){

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadArticle();
    sidebarSearch();

  }
);

</script>
